name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
        if: runner.os == 'Linux'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile --trust-lockfile
      - run: pnpm --filter @recompose/desktop exec node node_modules/electron/install.js
      - run: pnpm run lint:licenses
      - if: runner.os == 'macOS'
        shell: bash
        run: |
          for name in APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER CSC_LINK CSC_KEY_PASSWORD; do
            [ -n "${!name}" ] || { echo "mac release halted: secret $name is empty"; exit 1; }
          done
          key_file="$RUNNER_TEMP/apple-api-key.p8"
          trap 'rm -f "$key_file"' EXIT
          (umask 077 && printf '%s' "$APPLE_API_KEY" > "$key_file")
          APPLE_API_KEY="$key_file" pnpm --filter @recompose/desktop run build:mac
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      - if: runner.os == 'Windows'
        run: pnpm --filter @recompose/desktop run build:win
      - if: runner.os == 'Linux'
        run: pnpm --filter @recompose/desktop run build:linux
      - shell: bash
        run: |
          mkdir -p release-out
          find apps/desktop/dist -maxdepth 1 -type f \
            \( -name '*.dmg' -o -name '*.zip' -o -name '*.exe' -o -name '*.AppImage' -o -name '*.deb' \
               -o -name '*.blockmap' -o -name 'latest*.yml' \) \
            -exec cp {} release-out/ \;
          ls -la release-out
      - shell: bash
        run: |
          shopt -s nullglob
          manifests=(release-out/latest*.yml)
          [ "${#manifests[@]}" -gt 0 ] || { echo "no update manifest reached release-out"; exit 1; }
          for manifest in "${manifests[@]}"; do
            entries=0
            while read -r name expected; do
              actual=$(openssl dgst -sha512 -binary "release-out/$name" | base64 | tr -d '\n')
              [ "$actual" = "$expected" ] || { echo "sha512 mismatch: $name against $manifest"; exit 1; }
              entries=$((entries + 1))
            done < <(awk '/url:/ {url=$NF} /sha512:/ && url {print url, $NF; url=""}' "$manifest")
            [ "$entries" -gt 0 ] || { echo "no artifact entries in $manifest"; exit 1; }
          done
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: apps/desktop/dist
          format: cyclonedx-json
          output-file: release-out/sbom-${{ runner.os }}.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            release-out/*.dmg
            release-out/*.zip
            release-out/*.exe
            release-out/*.AppImage
            release-out/*.deb
            release-out/*.blockmap
            release-out/latest*.yml
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: |
            release-out/*.dmg
            release-out/*.zip
            release-out/*.exe
            release-out/*.AppImage
            release-out/*.deb
            release-out/*.blockmap
            release-out/latest*.yml
          sbom-path: release-out/sbom-${{ runner.os }}.cdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ runner.os }}
          path: release-out/
          retention-days: 3

  draft:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          merge-multiple: true
          path: assets/
      - run: gh release create "$TAG" assets/* --repo "$REPO" --draft --generate-notes --title "$TAG"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
