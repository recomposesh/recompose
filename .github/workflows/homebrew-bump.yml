name: homebrew-bump

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - shell: bash
        run: |
          version="${TAG#v}"
          arm_url=$(gh api "repos/${REPO}/releases/tags/${TAG}" \
            --jq '.assets[] | select(.name | endswith("-arm64.dmg")) | .browser_download_url')
          intel_url=$(gh api "repos/${REPO}/releases/tags/${TAG}" \
            --jq '.assets[] | select(.name | endswith("-x64.dmg")) | .browser_download_url')
          [ -n "$arm_url" ] || { echo "no arm64 dmg on release ${TAG}"; exit 1; }
          [ -n "$intel_url" ] || { echo "no x64 dmg on release ${TAG}"; exit 1; }
          curl -fsSL "$arm_url" -o arm.dmg
          curl -fsSL "$intel_url" -o intel.dmg
          [ -s arm.dmg ] || { echo "arm64 dmg download empty for ${TAG}"; exit 1; }
          [ -s intel.dmg ] || { echo "x64 dmg download empty for ${TAG}"; exit 1; }
          arm_sha=$(sha256sum arm.dmg | cut -d' ' -f1)
          intel_sha=$(sha256sum intel.dmg | cut -d' ' -f1)
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/tap_key
          chmod 600 ~/.ssh/tap_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/tap_key -o UserKnownHostsFile=~/.ssh/known_hosts"
          git clone git@github.com:recomposesh/homebrew-tap.git tap
          cd tap
          cat > Casks/recompose.rb <<CASK
          cask "recompose" do
            arch arm: "arm64", intel: "x64"

            version "${version}"
            sha256 arm:   "${arm_sha}",
                   intel: "${intel_sha}"

            url "https://github.com/${REPO}/releases/download/v#{version}/Recompose-#{version}-#{arch}.dmg"
            name "Recompose"
            desc "Local-first AI gateway composer"
            homepage "https://github.com/recomposesh/recompose"

            auto_updates true
            depends_on :macos

            app "Recompose.app"
          end
          CASK
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/recompose.rb
          if git diff --cached --quiet; then
            echo "cask already current"
            exit 0
          fi
          git commit -m "recompose ${version}"
          git push origin HEAD:main
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
          DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
