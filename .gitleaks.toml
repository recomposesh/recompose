[extend]
useDefault = true

[[allowlists]]
targetRules = ["generic-api-key"]
paths = ['''^\.agents/skills/''']

[[allowlists]]
targetRules = ["generic-api-key"]
regexes = ['''c8d89b3e-009b-49ee-91e7-05b07712fef5''']

[[allowlists]]
targetRules = ["generic-api-key"]
regexes = ['''8c5f6122-f9ab-45c7-9aa4-417cfc742206''']

# Antigravity's OAuth client pair, which every tool reaching that plan ships. Google registers no
# other client for it, documents an installed app's secret as not confidential, and binds the
# exchange by the loopback redirect this app listens on rather than by the string. Read from
# CLIProxyAPI's internal/auth/antigravity/constants.go.
[[allowlists]]
targetRules = ["generic-api-key"]
regexes = ['''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''']

[[rules]]
id = "forbidden-owner-alias"
description = "Repository owner's private alias must never appear in any artifact"
regex = '''(?i)r[e]yz'''

[[rules.allowlists]]
paths = ['''^pnpm-lock\.yaml$''']
