# Lefthook v2 runs jobs in array order; `priority` belongs to the legacy
# `commands:` and `scripts:` maps and is silently ignored here. The writers
# (fmt, lint) must precede every job that reads the text, or a gate passes on
# text that never lands (ADR-0128).
pre-commit:
  jobs:
    - name: protect-main
      run: test "$(git branch --show-current)" != "main"
      fail_text: main is protected — create a branch (one job = one worktree/branch + PR)
    - name: fmt
      glob: '*.{ts,tsx,mts,js,jsx,mjs,cjs,json,md,yaml,yml,html,css}'
      run: ./node_modules/.bin/oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    - name: lint
      glob: '*.{ts,tsx,mts,js,jsx,mjs,cjs}'
      run: ./node_modules/.bin/oxlint --fix --deny-warnings --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    - name: gitleaks
      run: mise install -q && mise exec -- gitleaks git --staged --redact --no-banner
    - name: boundaries
      run: pnpm run lint:boundaries
    - name: fsd
      run: pnpm run lint:fsd
    - name: dead
      run: pnpm run lint:dead
    - name: hig
      glob: '*.{ts,tsx,css,html}'
      run: pnpm run lint:hig
    - name: dup
      run: pnpm run lint:dup
    - name: spell
      run: pnpm exec cspell --no-progress --no-must-find-files {staged_files}
    - name: prose
      glob: '*.md'
      run: mise install -q && (test .vale/styles/Microsoft -nt .vale.ini || mise exec -- vale sync) && pnpm run lint:prose
    - name: openspec
      glob:
        - 'openspec/*'
        - 'openspec/**'
      run: pnpm run lint:openspec
    - name: typecheck
      run: pnpm run typecheck

pre-push:
  jobs:
    - name: stories
      run: pnpm run lint:stories

commit-msg:
  jobs:
    - name: commitlint
      run: pnpm exec commitlint --edit {1}
